[package]
name = "slack-mongo-bot"
version = "0.1.0"
edition = "2021"
description = "NL-to-MongoDB query bot with Web UI and Slack integration"

[dependencies]
# Web framework
actix-web = "4"
actix-ws = "0.3"
actix-rt = "2"

# MongoDB (official driver)
mongodb = "3.2"

# HTTP client (also used for Ollama API calls)
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"

# Config
dotenvy = "0.15"
clap = { version = "4", features = ["derive", "env"] }

# Security
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
hex = "0.4"

# Async utilities
futures = "0.3"

# Validation
chrono = { version = "0.4", features = ["serde"] }

# Concurrent cache
dashmap = "6.1"

# CSV export
csv = "1.3"

# Byte streams for actix
bytes = "1"
tokio-stream = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
