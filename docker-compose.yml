services:
  bot:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: movies
      # Ollama runs on the host machine, not in Docker.
      # On macOS Docker, host.docker.internal resolves to the host.
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:8b
      # llama.cpp also runs on the host (llama-server on port 8080)
      LLAMACPP_URL: http://host.docker.internal:8080
      LLM_PROVIDER: ollama
      HOST: 0.0.0.0
      PORT: "3000"
      RUST_LOG: info
      MAX_RESULT_ROWS: "10000"
      ALLOWED_OPERATIONS: find,count,distinct,aggregate,insert,update
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: imports movies and generates the other collections when missing,
  # so the bot introspects a populated database on startup.
  seed:
    image: mongo:7
    entrypoint: ["sh", "/scripts/seed-if-empty.sh"]
    environment:
      MONGO_DB_NAME: movies
      SEED: ${SEED:-true}
      FORCE_SEED: ${FORCE_SEED:-false}
    volumes:
      - ./scripts:/scripts:ro
      - ${MFLIX_DIR:-../mongodb-sample-dataset/sample_mflix}:/seed:ro
    depends_on:
      mongo:
        condition: service_started
    restart: "no"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
