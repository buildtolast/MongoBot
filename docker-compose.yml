services:
  bot:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: movies
      # Ollama runs on the host machine, not in Docker.
      # On macOS Docker, host.docker.internal resolves to the host.
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:8b
      # llama.cpp also runs on the host (llama-server on port 8080)
      LLAMACPP_URL: http://host.docker.internal:8080
      LLM_PROVIDER: ollama
      HOST: 0.0.0.0
      PORT: "3000"
      RUST_LOG: info
      MAX_RESULT_ROWS: "10000"
      ALLOWED_OPERATIONS: find,count,distinct,aggregate,insert,update
    depends_on:
      mongo:
        condition: service_started
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
